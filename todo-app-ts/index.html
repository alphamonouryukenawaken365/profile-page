<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App TypeScript — Andre Wijaya</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 1.5rem; }
    .input-row { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #1a1a2e; }
    button { padding: 10px 18px; background: #1a1a2e; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:hover { opacity: 0.85; }
    .filters { display: flex; gap: 8px; margin-bottom: 1rem; }
    .filter-btn { padding: 5px 14px; border: 1px solid #ddd; background: transparent; color: #555; border-radius: 20px; font-size: 13px; }
    .filter-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
    .todo-list { list-style: none; }
    .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .todo-item:last-child { border-bottom: none; }
    .todo-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
    .todo-text { flex: 1; font-size: 14px; color: #333; }
    .todo-text.done { text-decoration: line-through; color: #aaa; }
    .delete-btn { background: transparent; color: #ccc; border: none; font-size: 18px; padding: 0 6px; cursor: pointer; }
    .delete-btn:hover { color: #e74c3c; }
    .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: 13px; color: #888; }
    .clear-btn { background: transparent; color: #888; border: none; font-size: 13px; cursor: pointer; padding: 0; }
    .clear-btn:hover { color: #e74c3c; }
    .empty { text-align: center; color: #bbb; padding: 2rem 0; font-size: 14px; }
    .badge { display: inline-block; background: #a0c4ff; color: #1a1a2e; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 My Todo List <span class="badge">TypeScript</span></h1>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Add a new task..." />
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="footer-row">
      <span id="count">0 tasks left</span>
      <button class="clear-btn" id="clear-btn">Clear completed</button>
    </div>
  </div>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
